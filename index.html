<!DOCTYPE html>
<html lang="zh-TW">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>薩法拉爾大陸 - 命運之書</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
   <style>
       :root {
           --color-base: #2A2218;
           --color-parchment: #D2B48C;
           --color-parchment-light: #FAF0E6;
           --color-gold-dark: #C9A961;
           --color-gold: #D4AF37;
           --color-gold-bright: #FFD700;
           --color-purple: #9D7DB5;
           --color-text-dark: #3E2723;
           --color-accent: #8B7355;
       }

       body {
           background-color: var(--color-base);
           overflow: hidden;
           font-family: 'Crimson Text', serif;
           color: var(--color-parchment-light);
       }

       /* Typography */
       .font-cinzel { font-family: 'Cinzel', serif; }
       .font-crimson { font-family: 'Crimson Text', serif; }
       .font-garamond { font-family: 'Cormorant Garamond', serif; }

       /* Background Noise Texture */
       .noise-overlay {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           pointer-events: none;
           opacity: 0.05;
           z-index: 1;
           background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
       }

       /* Dust Particles Canvas */
       #dust-canvas {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           z-index: 2;
           pointer-events: none;
       }

       /* Magic Light Canvas */
       #magic-canvas {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           z-index: 3;
           pointer-events: none;
       }

       /* Main Container */
       .main-container {
           position: relative;
           z-index: 10;
           height: 100vh;
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
           opacity: 0;
           animation: fadeInMemory 0.8s ease-out forwards;
       }

       @keyframes fadeInMemory {
           0% { opacity: 0; filter: blur(10px); }
           100% { opacity: 1; filter: blur(0); }
       }

       /* Title Styling */
       .title-main {
           font-size: clamp(2rem, 5vw, 4rem);
           background: linear-gradient(90deg, var(--color-gold-dark), var(--color-gold-bright));
           -webkit-background-clip: text;
           -webkit-text-fill-color: transparent;
           background-clip: text;
           text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
           letter-spacing: 0.1em;
           position: relative;
       }

       .title-main::after {
           content: '薩法拉爾大陸';
           position: absolute;
           left: 0;
           top: 2px;
           background: linear-gradient(90deg, var(--color-gold-dark), var(--color-gold-bright));
           -webkit-background-clip: text;
           -webkit-text-fill-color: transparent;
           background-clip: text;
           filter: blur(8px);
           opacity: 0.4;
           z-index: -1;
       }

       .title-shadow {
           position: absolute;
           left: 2px;
           top: 3px;
           color: var(--color-base);
           opacity: 0.6;
           z-index: -2;
           filter: blur(1px);
       }

       .title-sub {
           font-size: clamp(1rem, 2vw, 1.5rem);
           letter-spacing: 0.15em;
           background: linear-gradient(90deg, var(--color-gold), var(--color-gold-bright));
           -webkit-background-clip: text;
           -webkit-text-fill-color: transparent;
           background-clip: text;
           opacity: 0.9;
       }

       .title-tagline {
           font-size: clamp(0.8rem, 1.5vw, 1.1rem);
           color: #A0826D;
           font-style: italic;
           transform: rotate(-2deg);
           margin-top: 0.5rem;
       }

       .highlight-word {
           border-bottom: 1px solid var(--color-gold);
           padding-bottom: 2px;
       }

       /* Diamond Sigils */
       .diamond-sigil {
           width: 20px;
           height: 20px;
           background: linear-gradient(135deg, var(--color-gold-bright), var(--color-gold-dark));
           transform: rotate(45deg);
           position: relative;
           box-shadow: 
               inset -2px -2px 4px rgba(0,0,0,0.3),
               inset 2px 2px 4px rgba(255,255,255,0.4),
               0 0 10px rgba(212, 175, 55, 0.5);
           opacity: 0;
           animation: sigilAppear 0.6s ease-out forwards;
       }

       .diamond-sigil.small {
           width: 14px;
           height: 14px;
           opacity: 0.7;
       }

       .diamond-sigil.large {
           width: 24px;
           height: 24px;
           box-shadow: 
               inset -3px -3px 6px rgba(0,0,0,0.3),
               inset 3px 3px 6px rgba(255,255,255,0.4),
               0 0 20px rgba(212, 175, 55, 0.6);
       }

       @keyframes sigilAppear {
           0% { transform: rotate(45deg) scale(0); opacity: 0; }
           100% { transform: rotate(45deg) scale(1); opacity: 1; }
       }

       /* Menu Buttons */
       .menu-button {
           position: relative;
           width: 320px;
           max-width: 80vw;
           height: 56px;
           margin: 12px 0;
           background: linear-gradient(90deg, 
               rgba(250, 240, 230, 0.1) 0%, 
               rgba(250, 240, 230, 0.4) 50%,
               rgba(250, 240, 230, 0.1) 100%);
           border: 2px solid var(--color-parchment);
           border-right: none;
           clip-path: polygon(
               0 0, 
               calc(100% - 20px) 0, 
               100% 50%, 
               calc(100% - 20px) 100%, 
               0 100%
           );
           cursor: pointer;
           transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
           display: flex;
           align-items: center;
           padding-left: 50px;
           opacity: 0.7;
           overflow: hidden;
       }

       .menu-button::before {
           content: '';
           position: absolute;
           left: 15px;
           width: 16px;
           height: 16px;
           background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
           transform: rotate(45deg);
           box-shadow: 
               inset -1px -1px 2px rgba(0,0,0,0.3),
               inset 1px 1px 2px rgba(255,255,255,0.4),
               0 0 8px rgba(212, 175, 55, 0.4);
           transition: all 0.3s ease;
       }

       .menu-button:hover {
           opacity: 1;
           background: linear-gradient(90deg, 
               rgba(250, 240, 230, 0.2) 0%, 
               rgba(250, 240, 230, 0.6) 50%,
               rgba(250, 240, 230, 0.2) 100%);
           border-color: #E8D4B8;
           transform: translateX(5px);
           box-shadow: 
               inset 0 0 30px rgba(212, 175, 55, 0.1),
               0 0 20px rgba(212, 175, 55, 0.2);
       }

       .menu-button:hover::before {
           box-shadow: 
               inset -1px -1px 2px rgba(0,0,0,0.3),
               inset 1px 1px 2px rgba(255,255,255,0.4),
               0 0 20px rgba(255, 215, 0, 0.8);
           transform: rotate(45deg) scale(1.1);
       }

       .menu-button.active {
           opacity: 1;
           transform: scale(1.02);
           border-color: var(--color-gold-bright);
       }

       .menu-button.active::before {
           box-shadow: 
               0 0 30px rgba(255, 215, 0, 1),
               inset 0 0 10px rgba(255, 215, 0, 0.5);
       }

       .button-text {
           font-family: 'Cinzel', serif;
           font-size: 1.1rem;
           color: var(--color-text-dark);
           font-weight: 600;
           letter-spacing: 0.1em;
           text-shadow: 0 1px 2px rgba(255,255,255,0.3);
       }

       .button-narrative {
           position: absolute;
           right: -120px;
           font-size: 0.85rem;
           color: var(--color-gold);
           font-style: italic;
           opacity: 0;
           transition: all 0.3s ease;
           white-space: nowrap;
           text-shadow: 0 0 10px rgba(0,0,0,0.8);
       }

       .menu-button:hover .button-narrative {
           opacity: 0.8;
           right: 30px;
       }

       /* Light sweep effect */
       .light-sweep {
           position: absolute;
           top: 0;
           left: -100%;
           width: 50%;
           height: 100%;
           background: linear-gradient(90deg, 
               transparent, 
               rgba(212, 175, 55, 0.3), 
               transparent
           );
           transition: left 0.6s ease;
           pointer-events: none;
       }

       .menu-button:hover .light-sweep {
           left: 150%;
           transition: left 0.8s ease;
       }

       /* Decorative Borders */
       .border-ornament {
           position: fixed;
           width: 150px;
           height: 150px;
           border: 2px solid var(--color-accent);
           opacity: 0.3;
           pointer-events: none;
           z-index: 5;
       }

       .border-ornament.top-left {
           top: 20px;
           left: 20px;
           border-right: none;
           border-bottom: none;
       }

       .border-ornament.top-right {
           top: 20px;
           right: 20px;
           border-left: none;
           border-bottom: none;
       }

       .border-ornament.bottom-left {
           bottom: 20px;
           left: 20px;
           border-right: none;
           border-top: none;
       }

       .border-ornament.bottom-right {
           bottom: 20px;
           right: 20px;
           border-left: none;
           border-top: none;
       }

       /* Corner Sigils */
       .corner-sigil {
           position: fixed;
           width: 40px;
           height: 40px;
           z-index: 6;
           opacity: 0.4;
           animation: pulse 4s ease-in-out infinite;
       }

       @keyframes pulse {
           0%, 100% { opacity: 0.3; }
           50% { opacity: 0.5; }
       }

       /* Fate Ring */
       .fate-ring-container {
           position: fixed;
           top: 30px;
           right: 30px;
           width: 100px;
           height: 100px;
           z-index: 20;
           cursor: pointer;
           transition: transform 0.3s ease;
       }

       .fate-ring-container:hover {
           transform: scale(1.1);
       }

       .fate-ring {
           width: 100%;
           height: 100%;
           animation: rotate 30s linear infinite;
       }

       .fate-ring-inner {
           position: absolute;
           top: 50%;
           left: 50%;
           transform: translate(-50%, -50%);
           width: 70%;
           height: 70%;
           animation: rotateReverse 15s linear infinite;
       }

       @keyframes rotate {
           from { transform: rotate(0deg); }
           to { transform: rotate(360deg); }
       }

       @keyframes rotateReverse {
           from { transform: rotate(360deg); }
           to { transform: rotate(0deg); }
       }

       /* Hints */
       .hint-text {
           position: fixed;
           font-size: 0.85rem;
           color: var(--color-gold);
           opacity: 0.5;
           font-style: italic;
           transition: opacity 0.5s ease;
           pointer-events: none;
       }

       .hint-main {
           bottom: 50px;
           left: 50%;
           transform: translateX(-50%);
       }

       .hint-secondary {
           bottom: 30px;
           left: 30px;
           color: #A0826D;
           font-size: 0.75rem;
       }

       .hint-control {
           bottom: 30px;
           right: 30px;
           color: #A0826D;
           font-size: 0.75rem;
       }

       /* Line of Fate */
       .fate-line {
           width: 60%;
           max-width: 600px;
           height: 1px;
           background: linear-gradient(90deg, 
               transparent, 
               var(--color-gold) 20%, 
               var(--color-gold) 80%, 
               transparent
           );
           margin: 2rem 0;
           position: relative;
           opacity: 0;
           animation: lineReveal 1.2s ease-out 0.5s forwards;
           box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
       }

       @keyframes lineReveal {
           0% { width: 0; opacity: 0; }
           100% { width: 60%; opacity: 0.6; }
       }

       .fate-line::before,
       .fate-line::after {
           content: '◆';
           position: absolute;
           top: -7px;
           color: var(--color-gold);
           font-size: 0.8rem;
           opacity: 0.6;
       }

       .fate-line::before { left: 10%; }
       .fate-line::after { right: 10%; }

       /* Responsive adjustments */
       @media (max-width: 768px) {
           .menu-button {
               width: 280px;
               height: 50px;
           }
           .fate-ring-container {
               width: 70px;
               height: 70px;
               top: 20px;
               right: 20px;
           }
           .border-ornament {
               width: 80px;
               height: 80px;
           }
       }

       /* Seal Opening Animation Overlay */
       .seal-overlay {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           pointer-events: none;
           z-index: 100;
           opacity: 0;
       }

       .seal-active {
           animation: sealOpen 0.8s ease-out forwards;
       }

       @keyframes sealOpen {
           0% {
               opacity: 1;
               background: radial-gradient(circle at center, 
                   rgba(212, 175, 55, 0.8) 0%, 
                   rgba(157, 125, 181, 0.6) 40%, 
                   transparent 70%
               );
           }
           100% {
               opacity: 0;
               background: radial-gradient(circle at center, 
                   transparent 0%, 
                   transparent 100%
               );
           }
       }

       /* Glyph decorations */
       .glyph-decoration {
           position: absolute;
           font-family: 'Cinzel', serif;
           color: var(--color-gold);
           opacity: 0.2;
           font-size: 0.9rem;
           pointer-events: none;
       }
   </style>
</head>
<body>

   <!-- Noise Texture -->
   <div class="noise-overlay"></div>

   <!-- Canvas Layers -->
   <canvas id="dust-canvas"></canvas>
   <canvas id="magic-canvas"></canvas>

   <!-- Seal Opening Effect -->
   <div class="seal-overlay seal-active" id="sealOverlay"></div>

   <!-- Decorative Borders -->
   <div class="border-ornament top-left"></div>
   <div class="border-ornament top-right"></div>
   <div class="border-ornament bottom-left"></div>
   <div class="border-ornament bottom-right"></div>

   <!-- Corner Sigils -->
   <svg class="corner-sigil" style="top: 15px; left: 15px;" viewBox="0 0 40 40">
       <path d="M20 5 L25 15 L35 20 L25 25 L20 35 L15 25 L5 20 L15 15 Z" fill="none" stroke="#D4AF37" stroke-width="1"/>
       <circle cx="20" cy="20" r="3" fill="#D4AF37"/>
   </svg>
   <svg class="corner-sigil" style="top: 15px; right: 15px;" viewBox="0 0 40 40">
       <rect x="10" y="10" width="20" height="20" fill="none" stroke="#D4AF37" stroke-width="1" transform="rotate(45 20 20)"/>
       <circle cx="20" cy="20" r="3" fill="#D4AF37"/>
   </svg>
   <svg class="corner-sigil" style="bottom: 15px; left: 15px;" viewBox="0 0 40 40">
       <path d="M20 5 Q30 20 20 35 Q10 20 20 5" fill="none" stroke="#D4AF37" stroke-width="1"/>
       <circle cx="20" cy="20" r="3" fill="#D4AF37"/>
   </svg>
   <svg class="corner-sigil" style="bottom: 15px; right: 15px;" viewBox="0 0 40 40">
       <path d="M10 10 L30 10 L30 30 L10 30 Z" fill="none" stroke="#D4AF37" stroke-width="1"/>
       <circle cx="20" cy="20" r="3" fill="#D4AF37"/>
   </svg>

   <!-- Fate Ring -->
   <div class="fate-ring-container" id="fateRing">
       <svg class="fate-ring" viewBox="0 0 100 100">
           <defs>
               <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                   <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.2" />
                   <stop offset="50%" style="stop-color:#FFD700;stop-opacity:0.4" />
                   <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0.2" />
               </linearGradient>
           </defs>
           <circle cx="50" cy="50" r="45" fill="none" stroke="url(#ringGradient)" stroke-width="1"/>
           <circle cx="50" cy="50" r="38" fill="none" stroke="url(#ringGradient)" stroke-width="1.5"/>
           <circle cx="50" cy="50" r="32" fill="none" stroke="url(#ringGradient)" stroke-width="1"/>
           <!-- Outer diamonds -->
           <g id="outer-diamonds"></g>
       </svg>
       <svg class="fate-ring-inner" viewBox="0 0 100 100">
           <circle cx="50" cy="50" r="25" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>
           <circle cx="50" cy="50" r="18" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.4"/>
           <!-- Inner diamonds -->
           <g id="inner-diamonds"></g>
       </svg>
   </div>

   <!-- Main Content -->
   <div class="main-container">
       
       <!-- Title Section -->
       <div class="text-center mb-4 relative">
           <!-- Top Sigils -->
           <div class="flex justify-center items-center gap-4 mb-4">
               <div class="diamond-sigil small" style="animation-delay: 0.1s"></div>
               <div class="diamond-sigil large" style="animation-delay: 0.2s"></div>
               <div class="diamond-sigil small" style="animation-delay: 0.3s"></div>
           </div>

           <h1 class="font-cinzel font-black title-main relative">
               <span class="title-shadow">薩法拉爾大陸</span>
               薩法拉爾大陸
           </h1>
           
           <h2 class="font-cinzel title-sub mt-2 tracking-widest">SAFARAR CONTINENT</h2>
           
           <p class="font-crimson title-tagline">
               A Chronicle of <span class="highlight-word">Choices</span> and <span class="highlight-word">Bonds</span>
           </p>

           <!-- Bottom Sigils -->
           <div class="flex justify-center items-center gap-4 mt-4">
               <div class="diamond-sigil small" style="animation-delay: 0.4s"></div>
               <div class="diamond-sigil large" style="animation-delay: 0.5s"></div>
               <div class="diamond-sigil small" style="animation-delay: 0.6s"></div>
           </div>
       </div>

       <!-- Fate Line -->
       <div class="fate-line"></div>

       <!-- Menu Buttons -->
       <div class="flex flex-col items-center mt-4 space-y-1" id="menuContainer">
           <button class="menu-button" data-index="0" data-narrative="踏入未知">
               <span class="light-sweep"></span>
               <span class="button-text">開始遊戲</span>
               <span class="button-narrative">踏入未知</span>
           </button>
           
           <button class="menu-button" data-index="1" data-narrative="回憶往昔">
               <span class="light-sweep"></span>
               <span class="button-text">讀取存檔</span>
               <span class="button-narrative">回憶往昔</span>
           </button>
           
           <button class="menu-button" data-index="2" data-narrative="古籍記載">
               <span class="light-sweep"></span>
               <span class="button-text">世界介紹</span>
               <span class="button-narrative">古籍記載</span>
           </button>
           
           <button class="menu-button" data-index="3" data-narrative="最新動態">
               <span class="light-sweep"></span>
               <span class="button-text">日誌更新</span>
               <span class="button-narrative">最新動態</span>
           </button>
           
           <button class="menu-button" data-index="4" data-narrative="調整命運">
               <span class="light-sweep"></span>
               <span class="button-text">設定</span>
               <span class="button-narrative">調整命運</span>
           </button>
           
           <button class="menu-button" data-index="5" data-narrative="創作者之言">
               <span class="light-sweep"></span>
               <span class="button-text">關於</span>
               <span class="button-narrative">創作者之言</span>
           </button>
       </div>

   </div>

   <!-- Hints -->
   <div class="hint-text hint-main" id="mainHint">向下滑動以選擇命運</div>
   <div class="hint-text hint-secondary" id="secondaryHint">開始全新冒險</div>
   <div class="hint-text hint-control">使用滑鼠滾動</div>

   <script>
       // Initialize Fate Ring Diamonds
       function createRingDiamonds() {
           const outerGroup = document.getElementById('outer-diamonds');
           const innerGroup = document.getElementById('inner-diamonds');
           const outerCount = 8;
           const innerCount = 6;
           
           for (let i = 0; i < outerCount; i++) {
               const angle = (i / outerCount) * 360;
               const diamond = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
               diamond.setAttribute('x', '48');
               diamond.setAttribute('y', '5');
               diamond.setAttribute('width', '4');
               diamond.setAttribute('height', '4');
               diamond.setAttribute('fill', '#D4AF37');
               diamond.setAttribute('opacity', '0.6');
               diamond.setAttribute('transform', `rotate(${angle} 50 50)`);
               outerGroup.appendChild(diamond);
           }
           
           for (let i = 0; i < innerCount; i++) {
               const angle = (i / innerCount) * 360;
               const diamond = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
               diamond.setAttribute('x', '48');
               diamond.setAttribute('y', '22');
               diamond.setAttribute('width', '4');
               diamond.setAttribute('height', '4');
               diamond.setAttribute('fill', '#FFD700');
               diamond.setAttribute('opacity', '0.8');
               diamond.setAttribute('transform', `rotate(${angle} 50 50)`);
               innerGroup.appendChild(diamond);
           }
       }
       createRingDiamonds();

       // Dust Particle System
       const dustCanvas = document.getElementById('dust-canvas');
       const dustCtx = dustCanvas.getContext('2d');
       let dustParticles = [];
       
       function resizeDustCanvas() {
           dustCanvas.width = window.innerWidth;
           dustCanvas.height = window.innerHeight;
       }
       resizeDustCanvas();
       window.addEventListener('resize', resizeDustCanvas);

       class DustParticle {
           constructor() {
               this.reset();
               this.y = Math.random() * dustCanvas.height; // Start anywhere initially
           }
           
           reset() {
               this.x = Math.random() * dustCanvas.width;
               this.y = dustCanvas.height + 10;
               this.size = Math.random() * 3 + 1;
               this.speedY = Math.random() * 0.3 + 0.1;
               this.speedX = (Math.random() - 0.5) * 0.2;
               this.opacity = Math.random() * 0.15 + 0.05;
               this.pulse = Math.random() * Math.PI;
           }
           
           update() {
               this.y -= this.speedY;
               this.x += this.speedX + Math.sin(this.y * 0.01) * 0.1;
               this.pulse += 0.02;
               this.currentOpacity = this.opacity * (0.8 + Math.sin(this.pulse) * 0.2);
               
               if (this.y < -10) {
                   this.reset();
               }
           }
           
           draw() {
               dustCtx.beginPath();
               dustCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
               dustCtx.fillStyle = `rgba(212, 175, 55, ${this.currentOpacity})`;
               dustCtx.fill();
           }
       }

       // Create dust particles
       for (let i = 0; i < 60; i++) {
           dustParticles.push(new DustParticle());
       }

       // Secondary smaller dust
       class MicroDust {
           constructor() {
               this.reset();
               this.y = Math.random() * dustCanvas.height;
           }
           
           reset() {
               this.x = Math.random() * dustCanvas.width;
               this.y = dustCanvas.height + 5;
               this.size = Math.random() * 1.5 + 0.5;
               this.speedY = Math.random() * 0.5 + 0.2;
               this.speedX = (Math.random() - 0.5) * 0.3;
               this.opacity = Math.random() * 0.08 + 0.04;
           }
           
           update() {
               this.y -= this.speedY;
               this.x += this.speedX;
               if (this.y < -5) this.reset();
           }
           
           draw() {
               dustCtx.beginPath();
               dustCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
               dustCtx.fillStyle = `rgba(250, 240, 230, ${this.opacity})`;
               dustCtx.fill();
           }
       }

       const microDust = [];
       for (let i = 0; i < 40; i++) {
           microDust.push(new MicroDust());
       }

       // Magic Rune System
       const magicCanvas = document.getElementById('magic-canvas');
       const magicCtx = magicCanvas.getContext('2d');
       let runes = [];
       let magicIntensity = 1;

       function resizeMagicCanvas() {
           magicCanvas.width = window.innerWidth;
           magicCanvas.height = window.innerHeight;
       }
       resizeMagicCanvas();
       window.addEventListener('resize', resizeMagicCanvas);

       const runeSymbols = ['ᚠ', 'ᚢ', 'ᚦ', 'ᚨ', 'ᚱ', 'ᚲ', 'ᚷ', 'ᚹ', 'ᚺ', 'ᚾ', 'ᛁ', 'ᛃ'];
       
       class Rune {
           constructor() {
               this.reset();
               this.x = Math.random() * magicCanvas.width;
               this.life = Math.random() * 1000;
           }
           
           reset() {
               this.x = Math.random() < 0.5 ? -50 : magicCanvas.width + 50;
               this.y = Math.random() * magicCanvas.height * 0.8 + magicCanvas.height * 0.1;
               this.symbol = runeSymbols[Math.floor(Math.random() * runeSymbols.length)];
               this.size = Math.random() * 20 + 15;
               this.speedX = (Math.random() - 0.5) * 0.3;
               this.speedY = (Math.random() - 0.5) * 0.2;
               this.opacity = 0;
               this.targetOpacity = Math.random() * 0.15 + 0.05;
               this.phase = Math.random() * Math.PI * 2;
               this.orbitRadius = Math.random() * 100 + 50;
               this.orbitSpeed = (Math.random() - 0.5) * 0.01;
               this.orbitAngle = Math.random() * Math.PI * 2;
               this.centerX = this.x;
               this.centerY = this.y;
           }
           
           update() {
               this.orbitAngle += this.orbitSpeed;
               this.x = this.centerX + Math.cos(this.orbitAngle) * this.orbitRadius;
               this.y = this.centerY + Math.sin(this.orbitAngle) * this.orbitRadius * 0.3;
               this.phase += 0.02;
               
               // Fade in/out
               if (this.life > 0) {
                   this.life--;
                   if (this.opacity < this.targetOpacity) this.opacity += 0.002;
               } else {
                   this.opacity -= 0.01;
                   if (this.opacity <= 0) {
                       this.reset();
                       this.life = 1000 + Math.random() * 500;
                   }
               }
               
               // Occasional flash
               if (Math.random() < 0.001) {
                   this.opacity = 0.4;
               }
           }
           
           draw() {
               magicCtx.save();
               magicCtx.globalAlpha = this.opacity * magicIntensity;
               magicCtx.font = \
               `${this.size}px Cinzel`;
               magicCtx.fillStyle = Math.random() > 0.5 ? '#9D7DB5' : '#D4AF37';
               magicCtx.shadowBlur = 10;
               magicCtx.shadowColor = magicCtx.fillStyle;
               magicCtx.fillText(this.symbol, this.x, this.y);
               magicCtx.restore();
           }
       }

       for (let i = 0; i < 12; i++) {
           runes.push(new Rune());
       }

       // Animation Loop
       function animate() {
           dustCtx.clearRect(0, 0, dustCanvas.width, dustCanvas.height);
           magicCtx.clearRect(0, 0, magicCanvas.width, magicCanvas.height);
           
           // Update dust
           dustParticles.forEach(p => {
               p.update();
               p.draw();
           });
           
           microDust.forEach(p => {
               p.update();
               p.draw();
           });
           
           // Update runes
           runes.forEach(r => {
               r.update();
               r.draw();
           });
           
           requestAnimationFrame(animate);
       }
       animate();

       // Menu Interaction
       const buttons = document.querySelectorAll('.menu-button');
       const secondaryHint = document.getElementById('secondaryHint');
       const mainHint = document.getElementById('mainHint');
       let activeIndex = 0;
       let hintTimeout;

       function updateActiveButton(index) {
           buttons.forEach((btn, i) => {
               if (i === index) {
                   btn.classList.add('active');
                   secondaryHint.textContent = btn.querySelector('.button-narrative').textContent;
                   secondaryHint.style.opacity = '0.6';
               } else {
                   btn.classList.remove('active');
               }
           });
       }

       buttons.forEach((btn, index) => {
           btn.addEventListener('mouseenter', () => {
               activeIndex = index;
               updateActiveButton(index);
               secondaryHint.textContent = btn.getAttribute('data-narrative');
               
               clearTimeout(hintTimeout);
               hintTimeout = setTimeout(() => {
                   mainHint.style.opacity = '0';
               }, 2000);
           });
           
           btn.addEventListener('click', () => {
               // Create ripple effect
               const ripple = document.createElement('div');
               ripple.style.position = 'absolute';
               ripple.style.width = '20px';
               ripple.style.height = '20px';
               ripple.style.background = 'radial-gradient(circle, rgba(212,175,55,0.8) 0%, transparent 70%)';
               ripple.style.borderRadius = '50%';
               ripple.style.transform = 'translate(-50%, -50%)';
               ripple.style.pointerEvents = 'none';
               ripple.style.animation = 'rippleExpand 0.6s ease-out forwards';
               btn.appendChild(ripple);
               
               setTimeout(() => ripple.remove(), 600);
               
               // Simulate action
               console.log(`Selected: ${btn.querySelector('.button-text').textContent}`);
           });
       });

       // Add ripple animation
       const style = document.createElement('style');
       style.textContent = `
           @keyframes rippleExpand {
               0% { width: 20px; height: 20px; opacity: 1; }
               100% { width: 300px; height: 300px; opacity: 0; }
           }
       `;
       document.head.appendChild(style);

       // Keyboard Navigation
       document.addEventListener('keydown', (e) => {
           if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
               activeIndex = (activeIndex + 1) % buttons.length;
               updateActiveButton(activeIndex);
               buttons[activeIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
           } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
               activeIndex = (activeIndex - 1 + buttons.length) % buttons.length;
               updateActiveButton(activeIndex);
               buttons[activeIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
           } else if (e.key === 'Enter') {
               buttons[activeIndex].click();
           }
       });

       // Mouse movement parallax
       document.addEventListener('mousemove', (e) => {
           const x = (e.clientX / window.innerWidth - 0.5) * 20;
           const y = (e.clientY / window.innerHeight - 0.5) * 20;
           
           document.querySelectorAll('.border-ornament').forEach((el, i) => {
               const factor = (i + 1) * 2;
               el.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
           });
       });

       // Fate Ring Interaction
       const fateRing = document.getElementById('fateRing');
       fateRing.addEventListener('mouseenter', () => {
           magicIntensity = 1.5;
           document.querySelector('.fate-ring').style.animationDuration = '15s';
           document.querySelector('.fate-ring-inner').style.animationDuration = '7.5s';
       });
       
       fateRing.addEventListener('mouseleave', () => {
           magicIntensity = 1;
           document.querySelector('.fate-ring').style.animationDuration = '30s';
           document.querySelector('.fate-ring-inner').style.animationDuration = '15s';
       });

       // Initialize first button as active
       updateActiveButton(0);

       // Hide hints after inactivity
       let inactivityTimeout;
       function resetInactivity() {
           clearTimeout(inactivityTimeout);
           inactivityTimeout = setTimeout(() => {
               mainHint.style.opacity = '0.5';
           }, 10000);
       }
       
       document.addEventListener('mousemove', resetInactivity);
       document.addEventListener('keydown', resetInactivity);
       resetInactivity();

       // Seal animation removal
       setTimeout(() => {
           document.getElementById('sealOverlay').style.display = 'none';
       }, 1000);
   </script>
</body>
</html>
